    <noscript>
      <h1>Negative Space</h1>
      <p>The gaps between the screens, as pixels.</p>
      <p>Lay out your LED walls and projection surfaces with their real physical sizes and resolutions, say how far apart they are, and it works out the composite canvas, blank pixels in the gaps included. Content laid out across the array then treats the space between the screens as if it were pixels, so a graphic crossing the stage disappears behind each gap instead of jumping it. Out come the canvas size, the slice rectangles with the gap offsets already applied, a Resolume Arena advanced-output file, a guide plate at exactly the canvas resolution, PowerPoint slide geometry and a starter deck, a CSV, and a PDF report with a scale plan.</p>
      <p>Negative Space runs in the browser and needs JavaScript.</p>
