# Cloudflare deployment for Negative Space.
#
# A static-assets-only Worker: no server code. Plain Vite, built by Cloudflare
# rather than committed, so `dist/` stays out of git. Set the build command in
# the Cloudflare project to:
#
#   npm ci && npm run build
#
# `public/_headers` is copied into dist/ by Vite and carries the CSP and the
# immutable-cache rule for hashed assets; the assets runtime honours it.
#
# `name` must match the Cloudflare project.

name = "negative-space"
compatibility_date = "2026-07-30"

[assets]
directory = "./dist"

# The custom domain is declared here rather than clicked into the dashboard, so the
# routing is in the repo and a fresh deploy reproduces it. Same shape as arraycad
# and simple-rta.
#
# Note this silently disables the workers.dev URL — wrangler defaults `workers_dev`
# to false once routes exist — so *.workers.dev links to this app 404 from the first
# deploy that carries this block.
[[routes]]
pattern = "negative-space.stoatworks-labs.com"
custom_domain = true
